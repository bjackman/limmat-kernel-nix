name: "Run test-golden"
on:
  workflow_call:
  pull_request:
  push:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    # lk-vm bundles a native aarch64 guest; a few per-config derivations
    # (etc-fstab etc.) can't substitute and must be built under emulation. This
    # mirrors boot.binfmt.emulatedSystems on the dev machines. The image
    # registers the handlers with the F (fix binary) flag, so the interpreter is
    # still reachable inside the Nix build sandbox.
    - uses: docker/setup-qemu-action@v3
      with:
        platforms: arm64
    - uses: DeterminateSystems/nix-installer-action@main
      with:
        extra-conf: extra-platforms = aarch64-linux
    - uses: DeterminateSystems/magic-nix-cache-action@main
      with:
        use-flakehub: false
    - run: nix flake check
    # Build first because Github's shitty UI doesn't handle the size of the Nix
    # build log very well.
    - run: nix build .#test-golden
    - run: mkdir /tmp/limmat-db
    - run: ./result/bin/limmat-kernel-test-golden /tmp/limmat-db
    - uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}       # run this step even if previous step failed
      with:
        name: limmat-db
        path: /tmp/limmat-db
    # OK this kiinda works but it turns out for some reason this tool ignores
    # all but the first line of the <failure> content.
    - uses: dorny/test-reporter@v2
      if: ${{ !cancelled() }}       # run this step even if previous step failed
      with:
        path: /tmp/limmat-db/**/junit.xml
        name: limmat-test-golden
        reporter: jest-junit